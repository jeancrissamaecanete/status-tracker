<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Squad Dashboard — 8x8 Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#08090c; --surface:#0f1015; --card:#13141a; --border:#1e2030; --border2:#252a38;
      --accent:#00d4ff; --text:#e2e8f0; --muted:#4a5168; --dim:#252a38;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; display:flex; height:100vh; overflow:hidden; }

    /* Sidebar */
    .sidebar { width:220px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
    .sidebar-title { font-size:13px; font-weight:700; color:var(--accent); }
    .sidebar-sub { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; margin-top:2px; }
    .summary-pills { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
    .summary-pill { display:flex; flex-direction:column; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:5px 8px; min-width:48px; }
    .summary-pill-num { font-size:16px; font-weight:700; line-height:1; }
    .summary-pill-label { font-size:9px; color:var(--muted); font-family:'DM Mono',monospace; margin-top:2px; }
    .agent-list { flex:1; overflow-y:auto; padding:8px; }
    .agent-item { display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:10px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; transition:all .15s; }
    .agent-item:hover { background:var(--card); border-color:var(--border); }
    .agent-item.selected { background:var(--card); border-color:var(--accent); }
    .agent-ring { width:34px; height:34px; border-radius:50%; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
    .agent-info { min-width:0; }
    .agent-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .agent-status { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'DM Mono',monospace; }
    .last-updated { padding:10px 14px; font-size:9px; color:var(--muted); font-family:'DM Mono',monospace; border-top:1px solid var(--border); }

    /* Main */
    .main { flex:1; overflow-y:auto; padding:28px; }
    .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--muted); font-family:'DM Mono',monospace; font-size:13px; gap:12px; }
    .placeholder-icon { font-size:48px; opacity:0.4; }

    /* Hero card */
    .hero { background:var(--card); border:1px solid var(--border2); border-radius:16px; padding:22px 24px; margin-bottom:20px; display:flex; align-items:center; gap:18px; }
    .hero-ring { width:56px; height:56px; border-radius:50%; border:3px solid; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; flex-shrink:0; }
    .hero-name { font-size:20px; font-weight:700; }
    .hero-status { font-size:13px; margin-top:3px; }
    .hero-timer { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; margin-top:4px; }

    /* Stats */
    .section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:12px; font-family:'DM Mono',monospace; }
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
    .stat-card-label { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:.08em; }
    .stat-card-value { font-size:22px; font-weight:700; margin:4px 0 2px; }
    .stat-card-sub { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }

    /* Timeline */
    .timeline { display:flex; flex-direction:column; gap:4px; margin-bottom:20px; }
    .tl-row { display:flex; align-items:flex-start; gap:10px; padding:9px 12px; background:var(--card); border:1px solid var(--border); border-radius:8px; }
    .tl-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:4px; }
    .tl-status { font-size:12px; font-weight:500; flex:1; }
    .tl-time { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; white-space:nowrap; }
    .tl-dur  { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
    .tl-reason-toggle { display:inline-flex; align-items:center; gap:5px; margin-top:5px; cursor:pointer; padding:2px 7px 2px 4px; border-radius:4px; border:1px solid #7b61ff33; background:#7b61ff0d; user-select:none; font-size:10px; color:#a78bfa; }
    .tl-reason-toggle:hover { background:#7b61ff20; }
    .tl-arrow { transition:transform .2s; }
    .tl-arrow.open { transform:rotate(180deg); }
    .tl-reason-body { display:none; margin-top:5px; font-size:11px; color:#94a3b8; font-style:italic; }
    .tl-reason-body.open { display:block; }

    /* Call updates */
    .lcu-section { margin-top:20px; }
    .lcu-list { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .lcu-empty { padding:20px; text-align:center; color:var(--muted); font-size:12px; font-family:'DM Mono',monospace; }
    .lcu-row { border-bottom:1px solid var(--border); }
    .lcu-row:last-child { border-bottom:none; }
    .lcu-row-header { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; transition:background .15s; }
    .lcu-row-header:hover { background:var(--surface); }
    .lcu-icon { font-size:14px; flex-shrink:0; }
    .lcu-row-info { flex:1; min-width:0; }
    .lcu-case-num { font-size:13px; font-weight:600; font-family:'DM Mono',monospace; }
    .lcu-meta { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; margin-top:2px; }
    .lcu-arrow { font-size:11px; color:var(--muted); transition:transform .2s; }
    .lcu-arrow.open { transform:rotate(180deg); }
    .lcu-body { display:none; padding:0 16px 14px; background:var(--surface); }
    .lcu-body.open { display:block; }
    .lcu-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:600; font-family:'DM Mono',monospace; margin-bottom:8px; }
    .lcu-preview { font-family:'DM Mono',monospace; font-size:11px; color:#94a3b8; background:var(--bg); padding:10px 12px; border-radius:8px; border:1px solid var(--border); white-space:pre-wrap; line-height:1.8; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Squad Dashboard</div>
    <div class="sidebar-sub">Live status · auto-refresh</div>
    <div class="summary-pills" id="sidebarSummary"></div>
  </div>
  <div class="agent-list" id="agentList"></div>
  <div class="last-updated" id="lastUpdated">—</div>
</div>

<div class="main" id="main">
  <div class="placeholder">
    <div class="placeholder-icon">👈</div>
    <div>Select an engineer to view details</div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
